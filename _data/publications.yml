# Newest first. `selected: true` puts the paper on the homepage.
- title:
    en: "TempoFit: Plug-and-Play Layer-Wise Temporal KV Memory for Long-Horizon Vision-Language-Action Manipulation"
    zh: "TempoFit：面向长程视觉-语言-动作操作的即插即用逐层时序 KV 记忆"
  authors: "J. Sun, B. Yang, J. Zhang, N. Ma, C. Wu, S. Zhang, Y. Huang, Q. Wang, S. Liang, Y. Chen"
  venue:
    en: "IEEE/RSJ International Conference on Intelligent Robots and Systems"
    zh: "IEEE/RSJ 国际智能机器人与系统会议"
  short_venue: "IROS 2026"
  tile_label: "IROS"
  year: 2026
  selected: true
  tldr:
    en: >
      A training-free retrofit that gives frozen VLA policies history awareness by caching
      intermediate-layer prefix K/V states — no parameter change, no longer inputs.
      +4.0 points on LIBERO-Long with π0.5, and up to +14.2% full-task success on a real Realman RM-65B.
    zh: "一种免训练的改造方法：通过缓存中间层前缀 K/V 状态，让冻结的 VLA 策略获得历史感知能力，既不改动参数也不加长输入。在 LIBERO-Long 上使 π0.5 提升 4.0 个百分点，真机 Realman RM-65B 上整任务成功率最高提升 14.2%。"
  links:
    - label: {en: "arXiv", zh: "arXiv"}
      url: "https://arxiv.org/abs/2603.07647"

