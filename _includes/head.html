<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.profile.name[page.lang] }}{% unless page.title %} · {{ site.data.profile.tagline[page.lang] }}{% endunless %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.author.name_en }}">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
{% if page.alt_url %}<link rel="alternate" hreflang="{% if page.lang == 'zh' %}en{% else %}zh-Hans{% endif %}" href="{{ site.url }}{{ page.alt_url }}">{% endif %}
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.profile.name[page.lang] }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
