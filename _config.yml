# ─────────────────────────────────────────────────────────────
#  Jun Sun — academic homepage
#  Bilingual (EN / 中文) Jekyll site, built for GitHub Pages.
# ─────────────────────────────────────────────────────────────

title            : "Jun Sun"
description      : "Jun Sun — world action models and reinforcement learning for robot manipulation."
url              : "https://luciosunj.github.io"
baseurl          : ""
repository       : "LucioSunj/LucioSunj.github.io"
lang             : "en"

author:
  name_en        : "Jun Sun"
  name_zh        : "孙俊"
  short_name     : "J. Sun"          # used to bold your name in author lists
  email          : "luciojunsun@gmail.com"
  github         : "LucioSunj"
  # Fill these in and they appear automatically; leave blank to hide.
  scholar        : ""                # e.g. https://scholar.google.com/citations?user=XXXX
  orcid          : ""
  linkedin       : ""
  twitter        : ""
  photo          : "/assets/img/profile.svg"
  cv_pdf         : "/files/Jun_Sun_CV.pdf"

# Build
markdown         : kramdown
highlighter      : rouge
permalink        : /:title/
timezone         : Asia/Shanghai

plugins:
  - jekyll-sitemap

sass:
  style: compressed

include:
  - .htaccess

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
